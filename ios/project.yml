name: DSAMatrix
options:
  bundleIdPrefix: com.shivangsingh
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: J97868B2D8
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  DSAMatrix:
    type: application
    platform: iOS
    sources:
      - DSAMatrix
      - Shared
    entitlements:
      path: DSAMatrix/DSAMatrix.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shivangsingh.dsamatrix
    dependencies:
      - target: DSAMatrixWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shivangsingh.dsamatrix
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DSA Matrix
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  DSAMatrixWidget:
    type: app-extension
    platform: iOS
    sources:
      - DSAMatrixWidget
      - Shared
    entitlements:
      path: DSAMatrixWidget/DSAMatrixWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shivangsingh.dsamatrix
    info:
      path: DSAMatrixWidget/Info.plist
      properties:
        CFBundleDisplayName: DSA Matrix
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shivangsingh.dsamatrix.widget
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  DSAMatrixTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DSAMatrixTests
    dependencies:
      - target: DSAMatrix
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shivangsingh.dsamatrix.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  DSAMatrixUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - DSAMatrixUITests
    dependencies:
      - target: DSAMatrix
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shivangsingh.dsamatrix.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  DSAMatrix:
    build:
      targets:
        DSAMatrix: all
    test:
      targets:
        - DSAMatrixTests
        - DSAMatrixUITests
