<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18181B"/>
      <stop offset="1" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="em" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>
  <g transform="translate(106 106)">
    <!-- 4x4 matrix: 300px, cells 66px, gap 12px -->
    <g fill="#27272A">
      <rect x="0" y="0" width="66" height="66" rx="14"/>
      <rect x="78" y="0" width="66" height="66" rx="14"/>
      <rect x="234" y="0" width="66" height="66" rx="14"/>
      <rect x="0" y="78" width="66" height="66" rx="14"/>
      <rect x="0" y="156" width="66" height="66" rx="14"/>
      <rect x="156" y="234" width="66" height="66" rx="14"/>
    </g>
    <g fill="#10B981" opacity="0.55" filter="url(#glow)">
      <rect x="156" y="0" width="66" height="66" rx="14"/>
      <rect x="78" y="78" width="66" height="66" rx="14"/>
      <rect x="156" y="78" width="66" height="66" rx="14"/>
      <rect x="234" y="78" width="66" height="66" rx="14"/>
      <rect x="78" y="156" width="66" height="66" rx="14"/>
      <rect x="156" y="156" width="66" height="66" rx="14"/>
      <rect x="234" y="156" width="66" height="66" rx="14"/>
      <rect x="0" y="234" width="66" height="66" rx="14"/>
      <rect x="78" y="234" width="66" height="66" rx="14"/>
      <rect x="234" y="234" width="66" height="66" rx="14"/>
    </g>
    <g fill="url(#em)">
      <rect x="156" y="0" width="66" height="66" rx="14"/>
      <rect x="78" y="78" width="66" height="66" rx="14"/>
      <rect x="156" y="78" width="66" height="66" rx="14"/>
      <rect x="234" y="78" width="66" height="66" rx="14"/>
      <rect x="78" y="156" width="66" height="66" rx="14"/>
      <rect x="156" y="156" width="66" height="66" rx="14"/>
      <rect x="234" y="156" width="66" height="66" rx="14"/>
      <rect x="0" y="234" width="66" height="66" rx="14"/>
      <rect x="78" y="234" width="66" height="66" rx="14"/>
    </g>
    <!-- today -->
    <rect x="234" y="234" width="66" height="66" rx="14" fill="url(#em)"/>
    <rect x="227" y="227" width="80" height="80" rx="20" fill="none" stroke="#FAFAFA" stroke-opacity="0.85" stroke-width="5"/>
  </g>
